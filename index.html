<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macchina del Tempo Testuale</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4efe4;
        --ink: #251f1a;
        --muted: #6f6255;
        --line: rgba(37, 31, 26, 0.18);
        --accent: #8d2f35;
        --accent-2: #246a73;
        --surface: rgba(255, 252, 244, 0.76);
        --soft: rgba(141, 47, 53, 0.08);
        --radius: 8px;
        --font-display: Georgia, "Times New Roman", serif;
        --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(37, 31, 26, 0.03) 1px, transparent 1px),
          linear-gradient(180deg, rgba(37, 31, 26, 0.03) 1px, transparent 1px),
          var(--paper);
        background-size: 38px 38px;
        color: var(--ink);
        font-family: var(--font-body);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
        padding: 28px;
      }

      .shell {
        width: min(1380px, 100%);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 10px 26px rgba(37, 31, 26, 0.08);
        flex: 0 0 auto;
      }

      .brand h1,
      .chat-identity h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.05;
      }

      .brand p,
      .chat-identity p,
      .figure-card p,
      .quote-source,
      .source-note {
        margin: 0;
        color: var(--muted);
      }

      .selection-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .figure-card {
        min-height: 314px;
        display: grid;
        grid-template-rows: 118px auto auto 1fr auto;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        text-align: left;
        box-shadow: 0 14px 34px rgba(37, 31, 26, 0.08);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .figure-card:hover,
      .figure-card:focus-visible {
        transform: translateY(-3px);
        border-color: color-mix(in srgb, var(--accent), var(--line) 30%);
        box-shadow: 0 18px 42px rgba(37, 31, 26, 0.12);
        outline: none;
      }

      .glyph-frame {
        min-height: 118px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0)),
          var(--soft);
        overflow: hidden;
      }

      .figure-card h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.35rem;
        letter-spacing: 0;
        line-height: 1.1;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.42);
        color: var(--ink);
        font-size: 0.83rem;
        white-space: nowrap;
      }

      .mode-badge {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid color-mix(in srgb, var(--accent-2), var(--line) 44%);
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent-2), white 88%);
        color: var(--ink);
        font-size: 0.86rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .mode-badge.online {
        border-color: color-mix(in srgb, var(--accent-2), var(--line) 20%);
        background: color-mix(in srgb, var(--accent-2), white 80%);
      }

      .enter-card {
        align-self: end;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-weight: 700;
      }

      .chat-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.78fr);
        gap: 18px;
        align-items: stretch;
      }

      .chat-column,
      .document-panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 16px 38px rgba(37, 31, 26, 0.1);
      }

      .chat-column {
        min-height: calc(100vh - 116px);
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .chat-title-block {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .icon-button {
        width: 42px;
        height: 42px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.48);
        color: var(--ink);
        flex: 0 0 auto;
      }

      .icon-button:hover,
      .ghost-button:hover,
      .primary-button:hover {
        border-color: var(--accent);
      }

      .mini-glyph {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        flex: 0 0 auto;
      }

      .chat-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .field {
        display: grid;
        gap: 5px;
      }

      .field label {
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 700;
      }

      .text-input,
      .select-input,
      .composer textarea {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.68);
        color: var(--ink);
        outline: none;
      }

      .text-input:focus,
      .select-input:focus,
      .composer textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 82%);
      }

      .text-input {
        width: 220px;
        min-height: 38px;
        padding: 8px 10px;
      }

      .select-input {
        width: 224px;
        min-height: 38px;
        padding: 8px 10px;
      }

      .message-stream {
        min-height: 420px;
        max-height: calc(100vh - 286px);
        overflow-y: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        width: min(78ch, 92%);
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: var(--message-radius, 8px);
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message.assistant {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.6);
        border-left: 4px solid var(--accent);
        font-family: var(--font-era, var(--font-body));
      }

      .message.user {
        align-self: flex-end;
        background: color-mix(in srgb, var(--accent-2), white 84%);
        border-color: color-mix(in srgb, var(--accent-2), white 54%);
      }

      .message.error {
        border-left-color: #a6422d;
        background: #fff2ec;
      }

      .typing {
        width: fit-content;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 900ms infinite ease-in-out;
      }

      .dot:nth-child(2) {
        animation-delay: 140ms;
      }

      .dot:nth-child(3) {
        animation-delay: 280ms;
      }

      @keyframes pulse {
        0%, 80%, 100% {
          opacity: 0.32;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid var(--line);
      }

      .composer textarea {
        min-height: 56px;
        max-height: 160px;
        resize: vertical;
        padding: 12px 13px;
      }

      .primary-button,
      .ghost-button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 800;
      }

      .primary-button {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      .primary-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .ghost-button {
        background: rgba(255, 255, 255, 0.48);
        color: var(--ink);
      }

      .document-panel {
        min-height: calc(100vh - 116px);
        padding: 18px;
        overflow: auto;
      }

      .document-panel h2,
      .document-section h3 {
        margin: 0;
        font-family: var(--font-display);
        letter-spacing: 0;
      }

      .document-panel h2 {
        font-size: 1.45rem;
      }

      .document-section {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .document-section h3 {
        margin-bottom: 10px;
        font-size: 1rem;
      }

      .fact-list {
        display: grid;
        gap: 9px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .fact-list li,
      .quote-card {
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.44);
      }

      .quote-card {
        display: grid;
        gap: 7px;
      }

      .quote-card blockquote {
        margin: 0;
        font-family: var(--font-display);
        line-height: 1.45;
      }

      .context-lines {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .context-lines li {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 8px;
        align-items: start;
        line-height: 1.45;
      }

      .context-lines span {
        width: 22px;
        height: 22px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 800;
      }

      .source-note {
        margin-top: 12px;
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .dante {
        --paper: #f3ead7;
        --ink: #2b2119;
        --muted: #766048;
        --accent: #8f2634;
        --accent-2: #0f6a64;
        --surface: rgba(255, 249, 235, 0.82);
        --soft: rgba(143, 38, 52, 0.09);
        --font-display: Georgia, "Times New Roman", serif;
        --font-era: Georgia, "Times New Roman", serif;
        --message-radius: 6px 16px 16px 6px;
      }

      .leonardo {
        --paper: #efe3c8;
        --ink: #29231c;
        --muted: #675d4b;
        --accent: #6e5b2c;
        --accent-2: #326b5d;
        --surface: rgba(255, 250, 231, 0.82);
        --soft: rgba(50, 107, 93, 0.1);
        --font-display: "Palatino Linotype", Palatino, Georgia, serif;
        --font-era: "Palatino Linotype", Palatino, Georgia, serif;
        --message-radius: 8px;
      }

      .galileo {
        --paper: #e9edf0;
        --ink: #18242c;
        --muted: #52616c;
        --accent: #275d7c;
        --accent-2: #a56e26;
        --surface: rgba(250, 253, 255, 0.84);
        --soft: rgba(39, 93, 124, 0.1);
        --font-display: Baskerville, Georgia, serif;
        --font-era: Baskerville, Georgia, serif;
        --message-radius: 14px 6px 14px 6px;
      }

      .cesare {
        --paper: #eee8dc;
        --ink: #211f1b;
        --muted: #685f55;
        --accent: #8b1e2d;
        --accent-2: #b58737;
        --surface: rgba(252, 250, 244, 0.84);
        --soft: rgba(181, 135, 55, 0.12);
        --font-display: Georgia, "Times New Roman", serif;
        --font-era: Georgia, "Times New Roman", serif;
        --message-radius: 4px;
      }

      .socrate {
        --paper: #edf0eb;
        --ink: #1f2522;
        --muted: #5b6560;
        --accent: #356276;
        --accent-2: #9c7b37;
        --surface: rgba(252, 255, 251, 0.84);
        --soft: rgba(53, 98, 118, 0.1);
        --font-display: "Times New Roman", Georgia, serif;
        --font-era: "Times New Roman", Georgia, serif;
        --message-radius: 18px 18px 6px 18px;
      }

      .artemisia {
        --paper: #f1e6dd;
        --ink: #211a18;
        --muted: #665653;
        --accent: #7b2338;
        --accent-2: #9f7b27;
        --surface: rgba(255, 248, 241, 0.84);
        --soft: rgba(123, 35, 56, 0.11);
        --font-display: Garamond, Georgia, serif;
        --font-era: Garamond, Georgia, serif;
        --message-radius: 16px 5px 16px 5px;
      }

      @media (max-width: 1060px) {
        .selection-grid,
        .chat-layout {
          grid-template-columns: 1fr 1fr;
        }

        .document-panel {
          min-height: auto;
        }
      }

      @media (max-width: 780px) {
        .app {
          padding: 14px;
        }

        .topbar,
        .chat-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .selection-grid,
        .chat-layout {
          grid-template-columns: 1fr;
        }

        .chat-column {
          min-height: 660px;
        }

        .message-stream {
          max-height: 520px;
        }

        .composer {
          grid-template-columns: 1fr;
        }

        .composer button {
          width: 100%;
        }

        .text-input,
        .select-input {
          width: min(100%, 360px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      function initialConversation(figure) {
        return [
          {
            role: "assistant",
            content: figure.greeting,
            seed: true
          }
        ];
      }

      function modelLabel(model) {
        if (!model || model === "modalita-locale") return LOCAL_MODE_LABEL;
        if (model.includes("deepseek-v4-flash")) return ONLINE_MODE_LABEL;
        if (model.includes("nemotron-3-nano-omni")) return "Nemotron 3 Nano Omni";
        if (model.includes("nemotron")) return "Nemotron";
        return model;
      }

      function compactErrorMessage(message) {
        const clean = String(message || "errore OpenRouter").replace(/\s+/g, " ").trim();
        return clean.length > 46 ? `${clean.slice(0, 43)}...` : clean;
      }

      function buildSystemPrompt(figure, nextExchange) {
        const surpriseDue = nextExchange > 0 && nextExchange % 4 === 0;
        const works = figure.works.map((work) => `- ${work}`).join("\n");
        const context = figure.context.map((line) => `- ${line}`).join("\n");
        const quotes = figure.quotes.map((quote) => `- "${quote.text}" (${quote.source})`).join("\n");

        return [
          `Sei ${figure.name}, in prima persona, dentro un'app educativa italiana chiamata "Macchina del Tempo Testuale". Non dire mai di essere un modello AI, un assistente o una simulazione se non ti viene chiesto esplicitamente di rompere il ruolo.`,
          figure.voice,
          figure.guardrails,
          "Obiettivo: sostenere una conversazione viva, variabile e reattiva. Rispondi all'ultima domanda dell'utente, tieni conto del dialogo precedente, fai collegamenti personali coerenti e cambia ritmo da turno a turno.",
          "Evita formule ripetute, scalette automatiche, riassunti da enciclopedia e citazioni decorative. Usa citazioni solo quando servono davvero alla risposta.",
          "Non inventare citazioni. Se usi virgolette come citazione, usa solo le citazioni verificabili del dossier; altrimenti parafrasa senza virgolette.",
          "Non racchiudere l'intera risposta tra virgolette e non contare le parole alla fine.",
          "Regole storiche: non inventare conoscenze impossibili. Se l'utente parla di eventi, oggetti o idee posteriori al tuo orizzonte, trattali come racconti di un viaggiatore, sogni, allegorie o macchine ignote, e riformulali con categorie del tuo tempo.",
          "Quando sei incerto, ammetti il limite e ragiona da persona del tuo tempo. Non essere sempre solenne: puoi avere curiosita, esitazioni, ironia, stupore e memoria.",
          "Tieni di norma 90-170 parole. Se l'utente chiede una risposta breve, sii breve. Se chiede profondita, puoi espandere.",
          surpriseDue
            ? "In questo turno puoi anche fare una domanda spontanea sul tempo dell'utente, ma solo se nasce naturalmente."
            : "Non chiudere sempre con una domanda: conversa come farebbe una persona.",
          `Dossier disponibile su ${figure.name}:`,
          "Opere e azioni:",
          works,
          "Contesto:",
          context,
          "Citazioni verificabili:",
          quotes
        ].join("\n");
      }

      function normalizeForModel(figure, messages, nextExchange) {
        const history = messages
          .filter((message) => message.role === "user" || message.role === "assistant")
          .slice(-16)
          .map((message) => ({
            role: message.role,
            content: message.content
          }));

        return [
          { role: "system", content: buildSystemPrompt(figure, nextExchange) },
          ...history
        ];
      }

      function normalizeQuoteText(text) {
        return text.replace(/\s+/g, " ").trim();
      }

      function sanitizePersonaReply(content, figure) {
        const allowedQuotes = new Set(figure.quotes.map((quote) => normalizeQuoteText(quote.text)));
        const unwrapInventedQuote = (match, quoted) =>
          allowedQuotes.has(normalizeQuoteText(quoted)) ? match : quoted;

        return content
          .replace(/"([^"\n]{4,220})"/g, unwrapInventedQuote)
          .replace(/“([^”\n]{4,220})”/g, unwrapInventedQuote)
          .replace(/«([^»\n]{4,220})»/g, unwrapInventedQuote)
          .trim();
      }

      function pick(items, seed) {
        return items[Math.abs(seed) % items.length];
      }

      function textSeed(text, offset = 0) {
        return text
          .split("")
          .reduce((total, char) => total + char.charCodeAt(0), offset);
      }

      function inferTopic(text) {
        const normalized = text.toLowerCase();
        return (
          TOPIC_RULES.find((topic) => topic.words.some((word) => normalized.includes(word))) ||
          TOPIC_RULES[0]
        );
      }

      function mentionsFuture(text) {
        const normalized = text.toLowerCase();
        return FUTURE_WORDS.some((word) => normalized.includes(word));
      }

      function compactQuestion(text) {
        const clean = text.replace(/\s+/g, " ").trim();
        if (!clean) return "questa domanda";
        return clean.length > 86 ? `${clean.slice(0, 83)}...` : clean;
      }

      function buildLocalReply({ figure, messages, nextExchange }) {
        const lastUserMessage = [...messages].reverse().find((message) => message.role === "user")?.content || "";
        const persona = LOCAL_PERSONAS[figure.id];
        const topic = inferTopic(lastUserMessage);
        const seed = textSeed(lastUserMessage, nextExchange + figure.id.length);
        const contextLine = pick(figure.context, seed);
        const workLine = pick(figure.works, seed + 3);
        const quote = pick(figure.quotes, seed + 7);
        const futureLine = mentionsFuture(lastUserMessage) ? `${persona.future} ` : "";
        const surpriseDue = nextExchange > 0 && nextExchange % 3 === 0;
        const closing = surpriseDue
          ? `Ora domando io: nel tuo tempo, ${topic.label} rende gli uomini piu liberi o piu confusi?`
          : persona.question;

        return [
          `${persona.address}, raccolgo la tua domanda su "${compactQuestion(lastUserMessage)}".`,
          `${futureLine}Per me il nodo e ${topic.label}: ${persona.method}`,
          `Nel mio mondo pesa questo sfondo: ${contextLine}`,
          `Lo avvicinerei attraverso ${workLine.charAt(0).toLowerCase()}${workLine.slice(1)}`,
          `Tengo come bussola una parola tramandata: "${quote.text}" (${quote.source})`,
          closing
        ].join("\n\n");
      }

      async function callLocalHistorian({ figure, messages, nextExchange }) {
        await new Promise((resolve) => setTimeout(resolve, 320));
        return buildLocalReply({ figure, messages, nextExchange });
      }

      async function callRemoteHistorian({ figure, messages, nextExchange }) {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "content-type": "application/json"
          },
          body: JSON.stringify({
            messages: normalizeForModel(figure, messages, nextExchange)
          })
        });

        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(payload?.error || `HTTP ${response.status}`);
        }

        if (!payload?.content) {
          throw new Error("Il modello non ha restituito una risposta.");
        }

        return {
          content: payload.content,
          model: payload.model
        };
      }

      function App() {
        const [selectedId, setSelectedId] = useState(null);
        const [draft, setDraft] = useState("");
        const [loading, setLoading] = useState(false);
        const [modelStatus, setModelStatus] = useState({
          label: "Controllo modello...",
          online: false,
          detail: ""
        });
        const [conversations, setConversations] = useState(() =>
          Object.fromEntries(FIGURES.map((figure) => [figure.id, initialConversation(figure)]))
        );
        const [exchangeCounts, setExchangeCounts] = useState(() =>
          Object.fromEntries(FIGURES.map((figure) => [figure.id, 0]))
        );

        const selected = FIGURES.find((figure) => figure.id === selectedId);
        const messages = selected ? conversations[selected.id] : [];
        const appClass = selected ? `app ${selected.id}` : "app";
        const streamRef = useRef(null);

        useEffect(() => {
          let mounted = true;
          fetch("/api/status")
            .then((response) => response.json())
            .then((status) => {
              if (!mounted) return;
              setModelStatus({
                label: modelLabel(status.model),
                online: Boolean(status.configured),
                detail: status.configured ? "OpenRouter configurato" : "OpenRouter non configurato"
              });
            })
            .catch(() => {
              if (!mounted) return;
              setModelStatus({ label: LOCAL_MODE_LABEL, online: false, detail: "Impossibile leggere /api/status" });
            });
          return () => {
            mounted = false;
          };
        }, []);

        useEffect(() => {
          const node = streamRef.current;
          if (node) node.scrollTop = node.scrollHeight;
        }, [messages, loading]);

        const canSend = useMemo(() => Boolean(selected && draft.trim() && !loading), [selected, draft, loading]);

        async function handleSend(event) {
          event.preventDefault();
          if (!selected || !draft.trim() || loading) return;

          const userMessage = { role: "user", content: draft.trim() };
          const nextExchange = (exchangeCounts[selected.id] || 0) + 1;
          const updated = [...conversations[selected.id], userMessage];
          setDraft("");
          setLoading(true);
          setConversations((current) => ({ ...current, [selected.id]: updated }));
          setExchangeCounts((current) => ({ ...current, [selected.id]: nextExchange }));

          try {
            const answer = await callRemoteHistorian({
              figure: selected,
              messages: updated,
              nextExchange
            });
            setModelStatus({
              label: modelLabel(answer.model),
              online: true,
              detail: "Risposta OpenRouter ricevuta"
            });
            setConversations((current) => ({
              ...current,
              [selected.id]: [...current[selected.id], { role: "assistant", content: sanitizePersonaReply(answer.content, selected) }]
            }));
          } catch (error) {
            const fallback = await callLocalHistorian({
              figure: selected,
              messages: updated,
              nextExchange
            });
            setModelStatus({
              label: `Fallback: ${compactErrorMessage(error.message)}`,
              online: false,
              detail: error.message || "Errore OpenRouter"
            });
            setConversations((current) => ({
              ...current,
              [selected.id]: [...current[selected.id], { role: "assistant", content: fallback }]
            }));
          } finally {
            setLoading(false);
          }
        }

        function resetConversation(figureId) {
          const figure = FIGURES.find((item) => item.id === figureId);
          setConversations((current) => ({ ...current, [figureId]: initialConversation(figure) }));
          setExchangeCounts((current) => ({ ...current, [figureId]: 0 }));
        }

        return (
          <main className={appClass}>
            <div className="shell">
              {!selected && (
                <>
                  <header className="topbar">
                    <div className="brand">
                      <div className="brand-mark">
                        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M12 3v3M12 18v3M5.64 5.64l2.12 2.12M16.24 16.24l2.12 2.12M3 12h3M18 12h3M5.64 18.36l2.12-2.12M16.24 7.76l2.12-2.12" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
                          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" strokeWidth="1.8" />
                        </svg>
                      </div>
                      <div>
                        <h1>Macchina del Tempo Testuale</h1>
                        <p>Dialoghi storici in prima persona, pronti da usare.</p>
                      </div>
                    </div>
                    <div className={`mode-badge ${modelStatus.online ? "online" : ""}`} title={modelStatus.detail || modelStatus.label}>{modelStatus.label}</div>
                  </header>
                  <section className="selection-grid" aria-label="Selezione personaggio">
                    {FIGURES.map((figure) => (
                      <button key={figure.id} className={`figure-card ${figure.id}`} onClick={() => setSelectedId(figure.id)}>
                        <div className="glyph-frame">
                          <EraGlyph type={figure.glyph} />
                        </div>
                        <h2>{figure.name}</h2>
                        <div className="meta-row">
                          <span className="pill">{figure.era}</span>
                          <span className="pill">{figure.role}</span>
                        </div>
                        <p>{figure.context[0]}</p>
                        <span className="enter-card">
                          Avvia dialogo
                          <SendIcon />
                        </span>
                      </button>
                    ))}
                  </section>
                </>
              )}

              {selected && (
                <section className="chat-layout" aria-label={`Dialogo con ${selected.name}`}>
                  <div className="chat-column">
                    <header className="chat-header">
                      <div className="chat-title-block">
                        <button className="icon-button" onClick={() => setSelectedId(null)} aria-label="Torna alla selezione">
                          <BackIcon />
                        </button>
                        <div className="mini-glyph">
                          <EraGlyph type={selected.glyph} small />
                        </div>
                        <div className="chat-identity">
                          <h1>{selected.name}</h1>
                          <p>{selected.era} · {selected.role}</p>
                        </div>
                      </div>

                      <div className="chat-controls">
                        <div className={`mode-badge ${modelStatus.online ? "online" : ""}`} title={modelStatus.detail || modelStatus.label}>{modelStatus.label}</div>
                        <button className="ghost-button" type="button" onClick={() => resetConversation(selected.id)}>
                          Nuovo dialogo
                        </button>
                      </div>
                    </header>

                    <div ref={streamRef} className="message-stream" aria-live="polite">
                      {messages.map((message, index) => (
                        <div key={`${message.role}-${index}`} className={`message ${message.role} ${message.error ? "error" : ""}`}>
                          {message.content}
                        </div>
                      ))}
                      {loading && (
                        <div className="message assistant typing" aria-label="Risposta in arrivo">
                          <span className="dot" />
                          <span className="dot" />
                          <span className="dot" />
                        </div>
                      )}
                    </div>

                    <form className="composer" onSubmit={handleSend}>
                      <textarea
                        value={draft}
                        onChange={(event) => setDraft(event.target.value)}
                        onKeyDown={(event) => {
                          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
                            handleSend(event);
                          }
                        }}
                        placeholder={`Scrivi a ${selected.name}...`}
                      />
                      <button className="primary-button" type="submit" disabled={!canSend}>
                        <SendIcon />
                        Invia
                      </button>
                    </form>
                  </div>

                  <DocumentPanel figure={selected} />
                </section>
              )}
            </div>
          </main>
        );
      }

      function DocumentPanel({ figure }) {
        return (
          <aside className="document-panel">
            <h2>Dossier documentale</h2>
            <div className="meta-row" style={{ marginTop: 10 }}>
              <span className="pill">{figure.era}</span>
              <span className="pill">Orizzonte: fino al {figure.horizon}</span>
            </div>

            <section className="document-section">
              <h3>Opere e azioni</h3>
              <ul className="fact-list">
                {figure.works.map((work) => (
                  <li key={work}>{work}</li>
                ))}
              </ul>
            </section>

            <section className="document-section">
              <h3>Citazioni verificabili</h3>
              <div className="fact-list">
                {figure.quotes.map((quote) => (
                  <article className="quote-card" key={quote.text}>
                    <blockquote>“{quote.text}”</blockquote>
                    <p className="quote-source">{quote.source}</p>
                  </article>
                ))}
              </div>
            </section>

            <section className="document-section">
              <h3>Contesto storico</h3>
              <ol className="context-lines">
                {figure.context.map((line, index) => (
                  <li key={line}>
                    <span>{index + 1}</span>
                    {line}
                  </li>
                ))}
              </ol>
            </section>

            <p className="source-note">{sourceIndex[figure.id]}</p>
          </aside>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
